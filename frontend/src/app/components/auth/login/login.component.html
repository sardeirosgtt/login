<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <img src="assets/layout/images/Captura_de_tela_de_2024-09-03_20-01-28-removebg-preview.png" alt="Sakai logo"
            class="mb-5 w-12rem flex-shrink-0">
        <div
            style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);">
            <div class="w-full surface-card py-8 px-5 sm:px-8" style="border-radius:53px">
                <div class="text-center mb-5">
                    <div class="text-900 text-3xl font-medium mb-3">Bem vindo!</div>
                    <span class="text-600 font-medium">Entre para continuar</span>
                </div>
                <div>
                    <label for="email1" class="block text-900 text-xl font-medium mb-2">Email ou Login</label>
                    <input id="email1" type="email" placeholder="Email ou Login" [(ngModel)]="login"
                        class="w-full md:w-30rem mb-5" style="padding:1rem">

                    <label for="password1" class="block text-900 font-medium text-xl mb-2">Password</label>
                    <input id="password1" type="password" placeholder="Senha" [(ngModel)]="password"
                        class="w-full p-3 md:w-30rem mb-5" (keydown)="handleKeyDown($event)">

                    <div class="flex align-items-center justify-content-between mb-5 gap-5">
                    </div>
                    <button pButton pRipple label="Entrar" class="w-full p-3 text-xl" (click)="logar()"></button>
                </div>
            </div>
        </div>
    </div>
</div>
